# GitHub Pages 配置（Jekyll）
# 启用方式：Settings → Pages → Source: Deploy from a branch → main / docs/
# 访问地址: https://akxan.github.io/SpyEyes/
#
# title / description 会被 jekyll-seo-tag 写进 <title>、meta description 和 Open Graph 标签。
# 英文为主;不要写版本号、测试数这类每次发版都会变的数字。

title: SpyEyes — All-in-One OSINT Toolkit
description: >-
  Free, open-source OSINT command-line toolkit in Python: username search across 3,164 sites,
  subdomain enumeration, domain email harvesting, IP geolocation, phone lookup, WHOIS and MX.
  No API keys required. English / 简体中文.
lang: en
theme: jekyll-theme-hacker

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 仓库信息
repository: Akxan/SpyEyes

# 默认在 Pages 显示的文件
defaults:
  - scope:
      path: ""
    values:
      layout: default
